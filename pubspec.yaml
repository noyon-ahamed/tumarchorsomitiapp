name: foundation_app
description: A Personal Foundation Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  google_fonts: ^6.2.1
  
  # Firebase - Updated to compatible versions
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.5
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network
  connectivity_plus: ^6.1.0

  sqflite: ^2.3.3+2
  path: ^1.9.0
  
  # UI & Utilities
  pinput: ^3.0.1
  image_picker: ^1.0.5
  intl: ^0.20.2
  
  # Icons & Design
  cupertino_icons: ^1.0.6
  
  # Google Sign-In
  google_sign_in: ^6.2.2
  
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^20.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/somiti_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/somiti_logo.png"